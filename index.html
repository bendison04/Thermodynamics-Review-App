<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MCEN 3012 Thermodynamics study quiz — 41 multiple-choice questions drawn from past exams and homework rubrics.">
<title>MCEN 3012 · Thermodynamics Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4ede0;
  --paper-deep: #ebe1cf;
  --ink: #1a1a2e;
  --ink-soft: #3d3d52;
  --ink-muted: #6e6e7e;
  --accent: #8b2635;
  --accent-soft: #c8505f;
  --correct: #2d6a4f;
  --correct-bg: #d8e8de;
  --wrong: #9d2929;
  --wrong-bg: #f0d8d8;
  --rule: rgba(26, 26, 46, 0.15);
  --grid: rgba(26, 26, 46, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
  padding: 40px 20px;
}

.container { max-width: 880px; margin: 0 auto; }

header {
  text-align: center;
  margin-bottom: 48px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--rule);
  position: relative;
}

header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 3px;
  background: var(--accent);
}

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--accent);
  margin-bottom: 12px;
  font-weight: 500;
}

h1 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(36px, 6vw, 56px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 8px;
}

h1 em {
  font-style: italic;
  color: var(--accent);
  font-weight: 300;
}

.subtitle {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--ink-muted);
  font-weight: 300;
}

.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-bottom: 32px;
}

.stat {
  background: var(--paper);
  padding: 16px 20px;
  text-align: center;
}

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.stat-value {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 500;
  color: var(--ink);
}

.stat-value .denom { color: var(--ink-muted); font-weight: 300; }

.progress-track {
  height: 4px;
  background: var(--rule);
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 40px;
  margin-bottom: 24px;
  position: relative;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--accent);
}

.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-muted);
  gap: 12px;
  flex-wrap: wrap;
}

.question-num { color: var(--accent); font-weight: 600; }

.topic-tag {
  background: var(--paper-deep);
  padding: 4px 10px;
  border: 1px solid var(--rule);
}

.question-text {
  font-family: 'Fraunces', serif;
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink);
  margin-bottom: 24px;
  font-weight: 400;
}

.diagram-container {
  background: var(--paper-deep);
  border: 1px solid var(--rule);
  padding: 24px;
  margin-bottom: 28px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.diagram-container svg { max-width: 100%; height: auto; }

.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 20px;
  background: var(--paper);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 16px;
  line-height: 1.5;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  width: 100%;
}

.option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--paper-deep);
  transform: translateX(2px);
}

.option:disabled { cursor: default; }

.option-letter {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--accent);
  text-transform: lowercase;
  flex-shrink: 0;
  min-width: 18px;
}

.option.selected { border-color: var(--ink); background: var(--paper-deep); }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.correct .option-letter { color: var(--correct); }
.option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.option.wrong .option-letter { color: var(--wrong); }

.feedback {
  margin-top: 24px;
  padding: 24px;
  border-left: 3px solid var(--accent);
  background: var(--paper-deep);
  font-family: 'Fraunces', serif;
  font-size: 16px;
  line-height: 1.7;
  display: none;
}

.feedback.visible { display: block; animation: slideDown 0.4s ease; }

.feedback-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-bottom: 12px;
  font-weight: 600;
}

.feedback.correct { border-left-color: var(--correct); }
.feedback.correct .feedback-header { color: var(--correct); }
.feedback.wrong { border-left-color: var(--wrong); }
.feedback.wrong .feedback-header { color: var(--wrong); }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.controls {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  font-weight: 500;
  padding: 14px 28px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn:hover { background: var(--ink); color: var(--paper); }

.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }

.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { background: var(--paper); color: var(--ink); }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 32px;
  align-items: center;
}

.filter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-muted);
  margin-right: 8px;
}

.filter-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: lowercase;
  letter-spacing: 0.05em;
  padding: 6px 14px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-muted);
  cursor: pointer;
  transition: all 0.2s ease;
}

.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.complete-screen {
  text-align: center;
  padding: 60px 40px;
  background: var(--paper);
  border: 1px solid var(--rule);
}

.complete-screen h2 {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 48px;
  margin-bottom: 16px;
  font-style: italic;
}

.complete-screen .score-display {
  font-family: 'Fraunces', serif;
  font-size: 80px;
  font-weight: 400;
  color: var(--accent);
  margin: 24px 0;
  line-height: 1;
}

.complete-screen .score-display .total { color: var(--ink-muted); font-weight: 300; }

.complete-screen .message {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--ink-muted);
  margin-bottom: 32px;
}

.topic-breakdown {
  text-align: left;
  margin: 32px auto 24px;
  max-width: 480px;
  border-top: 1px solid var(--rule);
  padding-top: 24px;
}

.topic-breakdown h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-muted);
  margin-bottom: 16px;
  text-align: center;
  font-weight: 500;
}

.topic-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--rule);
  font-size: 14px;
  align-items: center;
}

.topic-row:last-child { border-bottom: none; }
.topic-name { font-family: 'Fraunces', serif; font-style: italic; }
.topic-score { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-muted); }
.topic-pct { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--accent); min-width: 48px; text-align: right; }

.kbd-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-muted);
  text-align: center;
  margin-top: 16px;
  letter-spacing: 0.1em;
}

.kbd {
  display: inline-block;
  padding: 2px 6px;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  margin: 0 2px;
  font-size: 10px;
  background: var(--paper);
}

footer {
  text-align: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-muted);
}

.diagram svg text { font-family: 'Fraunces', serif; fill: var(--ink); }
.hatch-line { stroke: var(--ink-soft); stroke-width: 0.8; }
.water-wave { stroke: #2a5a8a; stroke-width: 0.8; fill: none; }
.vessel-stroke { stroke: var(--ink); stroke-width: 1.5; fill: none; }

@media (max-width: 600px) {
  body { padding: 20px 12px; }
  .question-card { padding: 24px; }
  .stats-bar { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  .btn { width: 100%; }
  .kbd-hint { display: none; }
}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="eyebrow">MCEN 3012 · Study Tool</div>
    <h1>Thermodynamics <em>Quiz</em></h1>
    <p class="subtitle">41 questions drawn from past exams and homework</p>
  </header>

  <div class="filters" id="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-chip active" data-filter="all">all topics</button>
    <button class="filter-chip" data-filter="state">state changes</button>
    <button class="filter-chip" data-filter="entropy">entropy &amp; 2nd law</button>
    <button class="filter-chip" data-filter="ideal-gas">ideal gas</button>
    <button class="filter-chip" data-filter="energy">energy balance</button>
    <button class="filter-chip" data-filter="cycles">cycles &amp; devices</button>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label">Question</div>
      <div class="stat-value">
        <span id="current-num">1</span><span class="denom">/<span id="total-num">1</span></span>
      </div>
    </div>
    <div class="stat">
      <div class="stat-label">Correct</div>
      <div class="stat-value" id="score-display">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Accuracy</div>
      <div class="stat-value" id="accuracy-display">—</div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
  </div>

  <div id="quiz-area"></div>

</div>

<footer>
  MCEN 3012 · Old Exam 2, Old Final, Homework 6
</footer>

dth="1.5" marker-end="url(#arrR)"/><text x="80" y="135" text-anchor="middle" font-size="11" font-style="italic">valve</text><text x="170" y="22" font-size="10" font-style="italic">2 (sup. vap)</text><text x="170" y="85" font-size="10" font-style="italic">3 (sat. liq)</text><text x="170" y="190" font-size="10" font-style="italic">4 (two-phase)</text><text x="170" y="245" font-size="10" font-style="italic">1 (sat. vap)</text></svg>`,nozzleDiffuser: `<svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/></marker></defs><text x="100" y="25" text-anchor="middle" font-size="12" font-style="italic">nozzle</text><polygon points="40,50 130,80 130,100 40,130" fill="none" stroke="#1a1a2e" stroke-width="1.5"/><line x1="20" y1="90" x2="40" y2="90" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrN)"/><line x1="130" y1="90" x2="170" y2="90" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrN)"/><text x="20" y="155" font-size="10" font-style="italic">slow, high h</text><text x="135" y="155" font-size="10" font-style="italic">fast, low h</text><text x="370" y="25" text-anchor="middle" font-size="12" font-style="italic">diffuser</text><polygon points="310,80 400,50 400,130 310,100" fill="none" stroke="#1a1a2e" stroke-width="1.5"/><line x1="290" y1="90" x2="310" y2="90" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrN)"/><line x1="400" y1="90" x2="440" y2="90" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrN)"/><text x="280" y="155" font-size="10" font-style="italic">fast, low h</text><text x="395" y="155" font-size="10" font-style="italic">slow, high h</text></svg>`};const TOPIC_LABELS = {'state': 'state changes','entropy': 'entropy & 2nd law','ideal-gas': 'ideal gas','energy': 'energy balance','cycles': 'cycles & devices'};

const QUESTIONS = [
  {topic: 'state', source: 'Old Exam 2 · Q2', question: 'A piston-cylinder device moves between State I and State II by removing one brick. In both states the cylinder contains H₂O in vapor-liquid equilibrium. The pressure is halved, and the volume in State II becomes twice the volume in State I. Consequently, P_I·V_I = P_II·V_II.', diagram: 'pistonBrickRemoved', options: ['Heat was added to the system.', 'Heat was removed from the system.', 'The system remained adiabatic.', 'The state change is impossible.', 'The state change is possible, but more information is needed to answer.'], correct: 4, explanation: 'The state change is physically possible (lower pressure, larger volume is consistent with removing a brick). For H₂O in the two-phase region, lowering pressure also lowers the saturation temperature. The energy balance Q = ΔU + W_b depends on the specific saturation values from the steam tables. Some choices give Q > 0, others give Q < 0. Without surrogate numbers from the tables, the direction of heat flow cannot be determined.'},
  {topic: 'energy', source: 'Old Exam 2 · Q3', question: 'An electric motor drives a pump to move water through a pipe. The water exits as a free jet into the atmosphere. The pump continuously uses 10 kW of electrical energy, and its efficiency does not change. What would happen to the speed of the water at the inlet to the pump if the outlet pipe diameter is halved?', diagram: 'pumpDiameter', options: ['It increases.', 'It remains the same.', 'It decreases.', 'More information is needed to answer.'], correct: 2, explanation: 'The mechanical energy equation gives η·Ẇ = ṁ[(P₂-P₁)/ρ + ½(v₂² - v₁²) + g(z₂-z₁)]. With outlet diameter halved, v₂ must increase (mass conservation: v·A = constant). Since the power input and efficiency are fixed, ½v₂² rises sharply, so ½v₁² must decrease to balance. Therefore v₁ decreases.'},
  {topic: 'state', source: 'Old Exam 2 · Q5', question: 'Two adiabatic piston-cylinder devices initially contain H₂O in vapor-liquid equilibrium with the same initial quality. Device I has one brick removed. Device II is heated by an electric coil until it reaches the same final volume as Device I. How do the final qualities of the two devices compare?', diagram: 'twoAdiabaticDevices', options: ['x_I > x_II', 'x_I = x_II', 'x_I < x_II', 'More information is needed.', 'It is not possible.'], correct: 2, explanation: 'Device I undergoes an adiabatic expansion (brick removed), so its final state moves to lower P at higher v — it ends up cooler and at lower pressure inside the dome. Device II is heated at constant pressure, expanding to the same final volume but staying at the original (higher) pressure. At the same v but higher P (Device II), the state sits further to the right under the dome, giving x_II > x_I.'},
  {topic: 'state', source: 'Old Exam 2 · Q6', question: 'Heat is added isobarically to water with a quality of 0.25. Δu of the water is _____ c_v·ΔT.', diagram: 'isobaricHeat', options: ['less than', 'equal to', 'greater than'], correct: 2, explanation: 'Inside the two-phase envelope, adding heat at constant pressure means temperature stays constant (ΔT = 0), so c_v·ΔT = 0. But Δu > 0 because internal energy increases as more liquid vaporizes. So Δu > c_v·ΔT. Even if you heat past the saturated vapor line into superheated, the relation u = u(T) only holds for ideal gases, not water near the dome, so Δu > c_v·ΔT remains true.'},
  {topic: 'state', source: 'Old Exam 2 · Q7', question: 'Two rigid vessels contain steam at 225°C. The vessels are connected by two pipes and a valve. The left vessel has x = 0.01 and the right has x = 0.99. Initially the valve is closed. Immediately after the valve is opened, the steam _____.', diagram: 'twoVessels', options: ['rushes into the vessel on the left', 'rushes into the vessel on the right', 'does not move'], correct: 2, explanation: 'Both vessels contain water in vapor-liquid equilibrium at the same temperature (225°C). For a two-phase system at a given temperature, the pressure is uniquely the saturation pressure at that T. Quality only determines the proportion of liquid to vapor, not the pressure. With identical pressures on both sides, no flow occurs immediately after the valve opens.'},
  {topic: 'state', source: 'Old Exam 2 · Q9', question: 'A piston contains saturated water vapor. A pile of sand rests on top. A single grain of sand is then placed on top of the pile. The system remains isothermal. What is the final state of the water?', diagram: 'pistonSandGrain', options: ['The water becomes a compressed liquid.', 'The water becomes a saturated liquid (x = 0).', 'The water becomes a mixture of liquid and vapor in equilibrium (0 < x < 1).', 'The water becomes a superheated vapor.'], correct: 0, explanation: 'Adding any sand raises the pressure above the saturation pressure for the current temperature. To stay at the same T but higher P, the state must move into the compressed liquid region (left of the dome on a P-v diagram). Heat must be removed to keep temperature constant during this compression.'},
  {topic: 'ideal-gas', source: 'Old Exam 2 · Q10', question: 'An adiabatic box contains two halves: the left half contains air, and the right half contains a perfect vacuum. They are initially separated by a diaphragm of equal volume, which then ruptures. Find the relationship between P₂ and P₁.', diagram: 'airVacuum', options: ['P₂ < ½ P₁', 'P₂ = ½ P₁', 'P₂ > ½ P₁'], correct: 1, explanation: 'The box is rigid (W = 0) and adiabatic (Q = 0), so ΔU = 0. For an ideal gas, this means ΔT = 0, so T₂ = T₁. Using the ideal gas law: P₂v₂/P₁v₁ = T₂/T₁ = 1. Volume doubles (v₂ = 2v₁), so P₂ = P₁(v₁/v₂) = ½P₁ exactly.'},
  {topic: 'entropy', source: 'Old Final · Q1', question: 'Both devices contain the same mass of liquid water and steam in vapor-liquid equilibrium. Device II has an additional brick on top (higher pressure). 10 kJ of heat is added to each.', diagram: 'twoDevicesHeat', options: ['The entropy remains constant in both devices.', 'The entropy for Device I goes up more.', 'The entropy for Device II goes up more.', 'The entropy goes up by the same amount in both devices.'], correct: 1, explanation: 'For heat addition at constant temperature, ΔS = Q/T. Device II has a higher pressure (extra brick), so a higher saturation temperature T_II > T_I. Same Q divided by larger T gives smaller ΔS. Therefore Device I (the colder one) gains more entropy from the same heat input.'},
  {topic: 'state', source: 'Old Final · Q2', question: 'An adiabatic piston-cylinder device contains saturated liquid water. Sand is on top of the piston. Half of the sand is removed one grain at a time, halving the pressure. What is the final state?', options: ['compressed liquid', '0 < x < 1', 'x = 1', 'superheated vapor'], correct: 1, explanation: 'Removing sand one grain at a time is reversible. Combined with adiabatic, the process is isentropic (Δs = 0). Starting at saturated liquid and dropping pressure isentropically (vertical line down on a T-s diagram from the saturated liquid line) puts the final state inside the two-phase dome with 0 < x < 1.'},
  {topic: 'ideal-gas', source: 'Old Final · Q3', question: 'Two piston-cylinder devices contain ideal gas with 2 kg of sand resting on top. Initially Device I contains 1 L of gas, Device II contains 2 L. Sand is removed one grain at a time until 1 kg remains on each. The state change is isothermal.', diagram: 'twoSandDevices', options: ['Heat was not added to either device.', 'More heat was added to Device I.', 'More heat was added to Device II.', 'The same amount of heat was added to both devices.'], correct: 2, explanation: 'Both devices undergo the same pressure drop (sand mass halved), and the process is isothermal so ΔU = 0 for each, meaning Q = W. Boundary work W = ∫P dV. Device II has twice the gas (twice the volume at the same pressure), so it does twice as much expansion work for the same pressure ratio. More work means more heat added: Device II receives more heat.'},
  {topic: 'energy', source: 'Old Final · Q4', question: 'Some liquid water is in equilibrium with its vapor in a piston-cylinder device. 100 kJ of heat is added, boiling off a little water. The temperature does not change. Which is true?', options: ['u₂ = u₁ + Q', 'h₂ = h₁ + Q', 'Δh = 0 and Δu = 0', 'Both a and b are true.'], correct: 1, explanation: 'For an isobaric process (the piston floats at constant P), the first law gives Q = ΔU + P·ΔV = (U₂ - U₁) + (P₂V₂ - P₁V₁) = H₂ - H₁. Per unit mass: Q = h₂ - h₁, so h₂ = h₁ + Q. Internal energy alone does not equal h₁ + Q because boundary work was done.'},
  {topic: 'ideal-gas', source: 'Old Final · Q5(I)', question: 'A volume of ideal gas at 300 kPa is expanded in the classroom to a pressure of 100 kPa and a volume that is three times as large. The absolute temperature of the air _____.', diagram: 'airExpand', options: ['increases by a factor of three', 'increases, but not by a factor of three', 'decreases', 'remains the same'], correct: 3, explanation: 'Use ideal gas law: P₁V₁/T₁ = P₂V₂/T₂. Plugging in: (300)(1)/T₁ = (100)(3)/T₂, which gives 300/T₁ = 300/T₂, so T₂ = T₁. Temperature is unchanged.'},
  {topic: 'ideal-gas', source: 'Old Final · Q5(II)', question: 'A volume of ideal gas at 300 kPa is expanded in the classroom to a pressure of 100 kPa and a volume that is three times as large. What about the heat transfer?', options: ['Heat flowed out of the air.', 'Heat flowed into the air.', 'Heat transfer was zero (adiabatic).'], correct: 1, explanation: 'The gas did boundary work as it expanded (W_b > 0). To keep its internal energy (and thus temperature, for an ideal gas) constant, heat must have flowed in to balance the work done. Q = ΔU + W = 0 + W > 0.'},
  {topic: 'ideal-gas', source: 'Old Final · Q7', question: 'If the pressure of an ideal gas is reduced adiabatically and isentropically, its enthalpy _____.', options: ['decreases', 'stays the same', 'increases'], correct: 0, explanation: 'Isentropic adiabatic expansion of an ideal gas drops temperature: T₂ = T₁(P₂/P₁)^((k-1)/k), and P₂ < P₁ means T₂ < T₁. For an ideal gas, h = c_p·T, so h is a function of T only. Lower T means lower h, so enthalpy decreases.'},
  {topic: 'state', source: 'Old Final · Q8', question: 'If it is done adiabatically, it ___ possible to form some liquid by squeezing a saturated vapor.', options: ['is', 'is not'], correct: 1, explanation: 'On a T-s diagram, squeezing (compressing) saturated vapor moves the state up and to the right (entropy can only increase or stay the same for an adiabatic process). Both directions move the state away from the two-phase dome into the superheated region. Forming liquid would require moving down-left into the dome, which requires removing heat — impossible adiabatically.'},
  {topic: 'entropy', source: 'Old Final · Q9', question: 'A volume of ideal gas is increased isothermally. The entropy of the gas _____.', options: ['increases', 'remains the same', 'decreases'], correct: 0, explanation: 'Use Δs = c_v·ln(T₂/T₁) + R·ln(v₂/v₁). Isothermal means the first term is zero. Since v₂ > v₁, ln(v₂/v₁) > 0, so Δs > 0. Entropy increases.'},
  {topic: 'ideal-gas', source: 'Old Final · Q10', question: 'The top brick is removed and the ideal gas expands isothermally. The enthalpy of the gas _____.', diagram: 'topBrickRemoved', options: ['goes up', 'remains the same', 'goes down'], correct: 1, explanation: 'For an ideal gas, enthalpy is a function of temperature only: h = c_p·T. If the process is isothermal, T does not change, so h does not change.'},
  {topic: 'energy', source: 'Homework 6 · Q4', question: 'Air is contained in part of a tank (left side, volume 2L). The other part (right side, volume L) is a vacuum. The partition in the tank is removed. What happens to the enthalpy of the air?', diagram: 'airVacuum', options: ['h₂ = ⅓ h₁', 'h₂ = ⅔ h₁', 'h₂ = h₁', 'h₂ = 2 h₁', 'h₂ = 3 h₁'], correct: 2, explanation: 'The tank is rigid (no boundary work) and adiabatic. ΔU = Q - W = 0. For an ideal gas, ΔU = m·c_v·ΔT = 0 means ΔT = 0. Since h = c_p·T for an ideal gas, h₂ = h₁.'},
  {topic: 'cycles', source: 'Homework 6 · Q6', question: 'Does it require more work to adiabatically compress a saturated liquid or an ideal gas from 10 kPa to 1000 kPa? If so, which one requires more work?', diagram: 'liquidVsGas', options: ['Yes, the saturated liquid.', 'Yes, the ideal gas.', 'No, the same amount of work is needed in both cases.'], correct: 1, explanation: 'Liquid is essentially incompressible, so its volume barely changes during compression. Boundary work W = ∫P dV is tiny — almost no area under the P-v curve. The ideal gas, on the other hand, undergoes a large volume change as it compresses, so a large area sits under the P-v curve. The ideal gas requires significantly more work.'},
  {topic: 'cycles', source: 'Homework 6 · Q9', question: 'An ideal gas flows through two turbines. Both turbines generate the same amount of shaft work. They both have the same inlet temperature T_warm and exhaust temperature T_cool. P_high and P_low are also the same. However, their isentropic efficiencies are different (70% vs 90%). Is this possible?', diagram: 'twoTurbines', options: ['This is possible.', 'This is impossible.'], correct: 1, explanation: 'For an ideal gas turbine, actual work Ẇ_out = ṁ·c_p·(T₁ - T₂), which depends only on inlet/outlet temperatures and ṁ. Both turbines have identical inlet and outlet conditions, so they must have identical actual work. Isentropic work Ẇ_out,s = ṁ·c_p·(T₁ - T_2s), and T_2s only depends on the pressure ratio — which is also the same. So both Ẇ_out and Ẇ_out,s are identical for both turbines, which means η_T = Ẇ_out/Ẇ_out,s must also be identical. Different efficiencies is impossible.'},
  {topic: 'cycles', source: 'Homework 6 · Q10', question: 'When operated adiabatically, which device, if any, can cause the following state transition for an ideal gas: enthalpy stays constant while pressure increases?', options: ['throttling valve', 'nozzle', 'diffuser', 'turbine', 'compressor', 'none of the above'], correct: 5, explanation: 'Constant enthalpy for an ideal gas means constant temperature (h = c_p·T). For an adiabatic process with constant T but increasing P, the entropy change is Δs = c_p·ln(T₂/T₁) - R·ln(P₂/P₁) = 0 - R·ln(P₂/P₁) < 0. Entropy decreasing in an adiabatic process violates the second law — impossible for any device.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'In a vapor-compression refrigeration cycle, the throttling valve is best modeled as:', diagram: 'refrigCycle', options: ['an isobaric process', 'an isothermal process', 'an isenthalpic pressure reduction', 'an isentropic expansion with shaft work output'], correct: 2, explanation: 'Across a throttling valve there is no shaft work and (to a good approximation) no heat transfer or change in kinetic/potential energy. The steady-flow energy balance reduces to h₁ = h₂ — an isenthalpic pressure drop. The valve is highly irreversible: pressure drops sharply (often into the two-phase dome) but enthalpy stays the same.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'In a vapor-compression refrigeration cycle, the condenser is best modeled as:', diagram: 'refrigCycle', options: ['isobaric heat removal (Q out, P ≈ const.)', 'isobaric heat addition', 'isenthalpic pressure reduction', 'isentropic compression'], correct: 0, explanation: 'The condenser rejects heat at the high-pressure side of the cycle. Its pressure drop is small enough to neglect, so it is modeled as isobaric heat removal: superheated vapor enters and saturated (or slightly subcooled) liquid leaves while temperature drops as the working fluid condenses.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'After the throttling valve in a vapor-compression refrigeration cycle, the working fluid is at about 20% quality (x ≈ 0.2). What region of the P-h diagram is this?', diagram: 'refrigCycle', options: ['compressed liquid (left of the dome)', 'saturated liquid line (x = 0)', 'inside the two-phase envelope', 'saturated vapor line (x = 1)', 'superheated vapor (right of the dome)'], correct: 2, explanation: 'A quality between 0 and 1 means vapor-liquid equilibrium under the dome. About 20% by mass is vapor, so the state sits roughly 20% of the way across the two-phase envelope on a P-h diagram.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'In the ideal vapor-compression refrigeration cycle, the compressor is modeled as:', diagram: 'refrigCycle', options: ['isobaric', 'isentropic (adiabatic + reversible)', 'isenthalpic', 'isothermal'], correct: 1, explanation: 'In the ideal cycle the compressor is adiabatic (Q = 0) and reversible (no entropy generation), so it is isentropic. Real compressors fall short of this ideal, which is captured by the isentropic efficiency η_C.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'For an adiabatic nozzle with negligible potential-energy change, the steady-flow energy equation per unit mass simplifies to:', diagram: 'nozzleDiffuser', options: ['h₁ - h₂ = ½(v₂² - v₁²)', 'h₁ + h₂ = 0', 'h₁ - h₂ = w_shaft', 'h₁ = h₂'], correct: 0, explanation: 'A nozzle has no shaft work and no heat transfer. The first law for steady flow becomes h₁ + ½v₁² = h₂ + ½v₂². Rearranging: h₁ - h₂ = ½(v₂² - v₁²). The drop in enthalpy is converted into kinetic energy.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'Across an adiabatic diffuser, neglecting potential-energy change, the enthalpy of the gas:', diagram: 'nozzleDiffuser', options: ['decreases', 'remains the same', 'increases'], correct: 2, explanation: 'A diffuser slows the flow (KE drops). With no shaft work, no heat, and negligible PE change, h₁ + ½v₁² = h₂ + ½v₂². If v₂ < v₁, then h₂ > h₁ — enthalpy increases. (A diffuser is essentially a nozzle run in reverse.)'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'The isentropic efficiency of a turbine is defined as:', options: ['η_T = W_actual / W_isentropic', 'η_T = W_isentropic / W_actual', 'η_T = Q_in / W_actual', 'η_T = W_actual / Q_in'], correct: 0, explanation: 'For a turbine the isentropic case is the maximum possible work output. The actual turbine produces less because of irreversibilities, so η_T = W_actual / W_isentropic ≤ 1.'},
  {topic: 'cycles', source: 'Old Exam 2 · FR (rubric)', question: 'The isentropic efficiency of a compressor is defined as:', options: ['η_C = W_actual / W_isentropic', 'η_C = W_isentropic / W_actual', 'η_C = Q_out / W_actual', 'η_C = W_actual / W_actual'], correct: 1, explanation: 'For a compressor the isentropic case is the minimum work required. Any irreversibility makes you do more, so the actual work is larger and η_C = W_isentropic / W_actual ≤ 1. Note this is the opposite ordering from turbines — in both cases the efficiency is bounded above by 1.'},
  {topic: 'energy', source: 'Old Final · FR (rubric)', question: 'Electrical power input to a pump moving water through a pipe with friction is distributed between:', options: ['shaft work output by the pump only', 'useful mechanical power delivered to the fluid plus power dissipated by friction', 'kinetic energy gain only', 'pressure rise only, since liquid is incompressible'], correct: 1, explanation: 'Energy in = energy out. The electrical input drives the pump shaft; the shaft adds mechanical energy (pressure rise, kinetic energy, elevation gain) to the fluid; friction dissipates the rest as heat. The pump efficiency η is exactly the fraction that reaches the fluid as useful mechanical work.'},
  {topic: 'entropy', source: 'Old Final · FR (rubric)', question: 'Which of the following processes is forbidden by the Second Law of Thermodynamics?', options: ['Complete conversion of work into heat (e.g., friction heating)', 'Spontaneous heat flow from a hot reservoir to a cold reservoir', 'Complete conversion of heat from a single reservoir into work in a cycle', 'Heat flow from a hot to a cold reservoir with some heat extracted as work'], correct: 2, explanation: 'This is the Kelvin-Planck statement: no cyclic device can convert heat from a single reservoir entirely into work with no other effect. Friction freely converts work into heat (a, allowed). Heat naturally flows hot → cold (b, allowed). A heat engine converts some heat to work while rejecting the rest to a cold reservoir (d, allowed). Only complete heat → work in a cycle is forbidden.'},
  {topic: 'entropy', source: 'Old Final · MC notes (rubric)', question: 'Two streams of fluid at different temperatures mix in an insulated chamber. The total entropy of the contents:', options: ['decreases', 'remains the same', 'increases'], correct: 2, explanation: 'Mixing of fluids at different temperatures (or compositions) is fundamentally irreversible. Even though no heat crosses the boundary, internal irreversibility generates entropy: ΔS_gen > 0. The hot stream cools, the cold stream warms, and total entropy rises.'},
  {topic: 'entropy', source: 'Old Final · MC notes (rubric)', question: 'Sand is removed one grain at a time from a piston-cylinder containing an ideal gas. The cylinder is adiabatic. The entropy of the gas:', options: ['decreases', 'remains the same', 'increases', 'depends on the direction of motion'], correct: 1, explanation: 'Removing one grain at a time approximates a reversible (quasi-static) process — at every instant the system is in mechanical equilibrium with the external load. Combined with the adiabatic boundary, this is an isentropic process: Δs = 0.'},
  {topic: 'state', source: 'Old Final · MC notes (rubric)', question: 'A piston-cylinder of gas slowly rises in the atmosphere as it expands, then slowly descends back to ground level. The expansion and contraction are reversible and adiabatic. At the top of its rise, the temperature of the gas compared to its initial temperature at ground level is:', options: ['higher', 'the same', 'lower', 'cannot be determined'], correct: 2, explanation: 'As the gas rises and the piston moves outward, the gas does boundary work on the atmosphere. With Q = 0, internal energy decreases and so does temperature. (When the cylinder returns to ground, the atmosphere does work back on the gas, returning it to the original temperature — this is a reversible cycle.)'},
  {topic: 'state', source: 'Homework 6 · MC notes (rubric)', question: 'A substance undergoes a process in which the pressure is halved, the temperature increases, AND the specific volume decreases. Which of the following must be true?', options: ['The substance is an ideal gas.', 'The substance cannot be an ideal gas.', 'The process is impossible.', 'The substance must be a saturated liquid.'], correct: 1, explanation: 'For an ideal gas Pv = RT, so v = RT/P. Halving P and raising T BOTH push v upward, so an ideal gas could not have v decrease here. The substance must be real (e.g., water near the dome where steam tables — not Pv = RT — govern), and the state must cross both isobars and isotherms in a way only a non-ideal substance allows.'},
  {topic: 'energy', source: 'Old Exam 2 · FR (rubric)', question: 'Water exits the pump described in Old Exam 2 · Q3 as a free jet at outlet diameter D₂ = D₁/2. By what factor does the outlet velocity exceed the inlet velocity? (Treat water as incompressible.)', diagram: 'pumpDiameter', options: ['2', '4', '½', '¼'], correct: 1, explanation: 'Mass conservation for incompressible flow: A₁v₁ = A₂v₂. Halving D₂ reduces A₂ by a factor of 4 (area ∝ D²). Therefore v₂ = 4·v₁. (This is what makes the outlet kinetic-energy term dominant in the mechanical energy equation in Q2.)'},
  {topic: 'cycles', source: 'MCEN 3012 · concept', question: 'Which device intentionally raises the pressure of a flowing fluid by adding shaft work?', options: ['turbine', 'nozzle', 'diffuser', 'compressor (or pump)', 'throttling valve'], correct: 3, explanation: 'A compressor (gas) or pump (liquid) consumes shaft work to raise pressure. A diffuser also raises pressure, but does so by slowing the flow with no shaft work. Turbines extract work; nozzles drop pressure to gain velocity; throttles drop pressure with no work or heat.'},
  {topic: 'state', source: 'MCEN 3012 · concept', question: 'For a compressed (subcooled) liquid where compressed-liquid tables are unavailable, the standard engineering approximation is:', options: ['treat properties (v, u, s) as those of the saturated liquid at the same temperature', 'treat properties as those of the saturated liquid at the same pressure', 'treat the liquid as an ideal gas', 'use the saturated vapor values at the same temperature'], correct: 0, explanation: 'Liquid properties depend weakly on pressure, so v ≈ v_f(T), u ≈ u_f(T), s ≈ s_f(T). For enthalpy a small correction h ≈ h_f(T) + v_f(T)·[P − P_sat(T)] is sometimes added, but the same-temperature saturated-liquid approximation is the workhorse.'},
  {topic: 'entropy', source: 'MCEN 3012 · concept', question: 'For an internally reversible heat addition Q to a system at constant temperature T, the entropy change of the system is:', options: ['ΔS = T·Q', 'ΔS = Q / T', 'ΔS = Q·ln(T)', 'ΔS depends on the substance'], correct: 1, explanation: 'For an internally reversible process, dS = δQ/T. At constant T this integrates to ΔS = Q/T. This is exactly why the Old Final · Q1 problem (10 kJ added at two different saturation temperatures) gives a larger entropy change to the cooler device.'},
  {topic: 'cycles', source: 'MCEN 3012 · concept', question: 'For an adiabatic compressor with a fixed pressure ratio, increasing the isentropic efficiency η_C from 70% to 90% will:', options: ['increase the actual work required', 'decrease the actual work required', 'leave the actual work unchanged', 'increase the heat removal'], correct: 1, explanation: 'η_C = W_isentropic / W_actual, so W_actual = W_isentropic / η_C. The isentropic work is fixed by inlet T and the pressure ratio. Raising η_C shrinks the denominator-correction, so W_actual drops. A more efficient compressor uses less power.'},
  {topic: 'energy', source: 'Old Final · FR (rubric)', question: 'A pump discharges water as a free jet into the atmosphere. In the mechanical-energy equation, the pressure at the outlet (the jet) is taken to be:', diagram: 'pumpDiameter', options: ['the pump discharge pressure (high)', 'atmospheric pressure', 'the saturation pressure of water', 'zero (vacuum)'], correct: 1, explanation: 'A free jet exhausts into the atmosphere, so its surface pressure equals atmospheric. The pressure at the outlet boundary in the mechanical-energy equation is therefore P_atm — usually the same datum as the inlet, which makes (P₂ - P₁)/ρ small or zero in the simplified form.'}
];

// ============================================================
// QUIZ ENGINE
// ============================================================
let questions = [];
let currentIndex = 0;
let score = 0;
let answered = 0;
let activeFilter = 'all';
let selectedIdx = null;
const topicStats = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function letter(i) {
  return String.fromCharCode(97 + i);
}

function applyFilter() {
  if (activeFilter === 'all') {
    questions = shuffle(QUESTIONS);
  } else {
    questions = shuffle(QUESTIONS.filter(q => q.topic === activeFilter));
  }
  currentIndex = 0;
  score = 0;
  answered = 0;
  selectedIdx = null;
  Object.keys(topicStats).forEach(k => delete topicStats[k]);
  render();
}

function updateStats() {
  document.getElementById('total-num').textContent = questions.length;
  document.getElementById('current-num').textContent = Math.min(currentIndex + 1, questions.length);
  document.getElementById('score-display').textContent = score;
  const accuracy = answered > 0 ? Math.round((score / answered) * 100) + '%' : '—';
  document.getElementById('accuracy-display').textContent = accuracy;
  const progress = questions.length > 0 ? (answered / questions.length) * 100 : 0;
  document.getElementById('progress-fill').style.width = progress + '%';
}

function buildTopicBreakdown() {
  const rows = Object.entries(topicStats)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([topic, s]) => {
      const pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
      const label = TOPIC_LABELS[topic] || topic;
      return `<div class="topic-row"><span class="topic-name">${label}</span><span class="topic-score">${s.correct}/${s.total}</span><span class="topic-pct">${pct}%</span></div>`;
    }).join('');
  return rows ? `<div class="topic-breakdown"><h3>By Topic</h3>${rows}</div>` : '';
}

function render() {
  const area = document.getElementById('quiz-area');
  updateStats();

  if (questions.length === 0) {
    area.innerHTML = `<div class="complete-screen"><h2>No questions match</h2><p class="message">Try a different topic filter.</p></div>`;
    return;
  }

  if (currentIndex >= questions.length) {
    const pct = Math.round((score / questions.length) * 100);
    let message = '';
    if (pct === 100) message = 'A flawless run. Now do it again with a different filter.';
    else if (pct >= 85) message = 'Solid mastery. Review the explanations on any you missed.';
    else if (pct >= 70) message = 'Decent. Walk through the misses and try again.';
    else if (pct >= 50) message = 'There is work to do. Read each explanation carefully.';
    else message = 'Time to revisit the notes. Run it again after some review.';

    area.innerHTML = `<div class="complete-screen"><h2>Complete</h2><div class="score-display">${score}<span class="total">/${questions.length}</span></div><p class="message">${message}</p>${buildTopicBreakdown()}<button class="btn btn-primary" onclick="applyFilter()">Try again</button></div>`;
    return;
  }

  const q = questions[currentIndex];
  const diagramHtml = q.diagram ? `<div class="diagram-container">${DIAGRAMS[q.diagram] || ''}</div>` : '';

  area.innerHTML = `<div class="question-card"><div class="question-meta"><span class="question-num">Question ${currentIndex + 1}</span><span class="topic-tag">${q.source}</span></div><p class="question-text">${q.question}</p>${diagramHtml}<div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="btn" id="skip-btn" onclick="skipQuestion()">Skip</button><button class="btn btn-primary" id="next-btn" onclick="submitAnswer()" disabled>Submit</button></div></div><div class="kbd-hint"><span class="kbd">1</span>–<span class="kbd">${q.options.length}</span> select &nbsp;·&nbsp; <span class="kbd">Enter</span> submit / next &nbsp;·&nbsp; <span class="kbd">→</span> skip</div>`;

  const opts = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${letter(i)}.</span><span>${opt}</span>`;
    btn.onclick = () => selectOption(i);
    btn.dataset.idx = i;
    opts.appendChild(btn);
  });
}

function selectOption(i) {
  if (document.getElementById('feedback').classList.contains('visible')) return;
  selectedIdx = i;
  document.querySelectorAll('.option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = 'Submit';
  nextBtn.disabled = false;
  nextBtn.onclick = submitAnswer;
}

function submitAnswer() {
  if (selectedIdx === null) return;
  const fb = document.getElementById('feedback');
  if (fb.classList.contains('visible')) {
    nextQuestion();
    return;
  }

  const q = questions[currentIndex];
  const isCorrect = selectedIdx === q.correct;
  answered++;
  if (isCorrect) score++;

  if (!topicStats[q.topic]) topicStats[q.topic] = { correct: 0, total: 0 };
  topicStats[q.topic].total++;
  if (isCorrect) topicStats[q.topic].correct++;

  document.querySelectorAll('.option').forEach((el, idx) => {
    el.disabled = true;
    el.classList.remove('selected');
    if (idx === q.correct) el.classList.add('correct');
    else if (idx === selectedIdx) el.classList.add('wrong');
  });

  fb.className = `feedback visible ${isCorrect ? 'correct' : 'wrong'}`;
  fb.innerHTML = `<div class="feedback-header">${isCorrect ? '✓ Correct' : '✗ Not quite'}</div><div>${isCorrect ? '' : `The correct answer is <strong>${letter(q.correct)}</strong>. `}${q.explanation}</div>`;

  updateStats();

  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentIndex + 1 >= questions.length ? 'Finish' : 'Next →';
  nextBtn.disabled = false;
  nextBtn.onclick = nextQuestion;
  document.getElementById('skip-btn').style.display = 'none';
}

function nextQuestion() {
  selectedIdx = null;
  currentIndex++;
  render();
}

function skipQuestion() {
  selectedIdx = null;
  currentIndex++;
  render();
}

document.addEventListener('keydown', e => {
  const q = questions[currentIndex];
  if (!q) return;

  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= q.options.length) {
    const fb = document.getElementById('feedback');
    if (!fb || fb.classList.contains('visible')) return;
    selectOption(num - 1);
    return;
  }

  if (e.key === 'Enter') {
    const fb = document.getElementById('feedback');
    if (fb && fb.classList.contains('visible')) {
      nextQuestion();
    } else if (selectedIdx !== null) {
      submitAnswer();
    }
    return;
  }

  if (e.key === 'ArrowRight') {
    const fb = document.getElementById('feedback');
    if (fb && !fb.classList.contains('visible')) {
      skipQuestion();
    }
  }
});

document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    applyFilter();
  });
});

applyFilter();

</script>
</body>
</html>
